<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Militaru Alexandru Bogdan – laboratoare</title>
    <style>
      /* Formatarea listei neordonate */
      ul.lista-laboratoare {
        list-style-type: none; /* Ascunde bulinele */
        padding: 0;
        display: flex;
        flex-direction: column; /* Așează butoanele pe verticală */
        gap: 10px; /* Spațiu între butoane */
      }

      /* Formatarea linkurilor ca butoane uniforme */
      ul.lista-laboratoare li a {
        display: block;
        width: 300px; /* Lățime uniformă pentru toate butoanele */
        background-color: #3498db; /* Culoare uniformă (albastru) */
        color: white; /* Text alb */
        text-align: center; /* Text centrat */
        text-decoration: none; /* Fără subliniere */
        padding: 12px; /* Spațiu interior */
        border-radius: 8px; /* Colțuri rotunjite */
        font-family: Arial, sans-serif;
        font-weight: bold;
        transition: background-color 0.3s; /* Tranziție lină pentru efectul de hover */
      }

      /* Schimbarea culorii la hover (trecerea cursorului) */
      ul.lista-laboratoare li a:hover {
        background-color: #2980b9; /* Albastru mai închis */
      }
    </style>
  </head>

    </ul>
  </body>
</html>
